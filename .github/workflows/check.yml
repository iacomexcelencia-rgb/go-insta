name: Check independent installation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        install: [root, hostinger]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -v
      - run: node --check go-public/app.js && node --check go-public/analytics.js && node --check go-public/onboarding.js
      - if: matrix.install == 'hostinger'
        run: docker compose -f scripts/compose.proxy-test.yaml up -d
      - run: sudo python3 scripts/smoke.py prepare ${{ matrix.install }}
      - run: python manage.py config --quiet && python manage.py up -d --build --wait --wait-timeout 120
      - run: sudo python3 scripts/smoke.py check
      - if: always()
        run: |
          python manage.py logs --tail 60
          python manage.py down
          docker compose -f scripts/compose.proxy-test.yaml down
